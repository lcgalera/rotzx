# Atualiza os dados do atlas a partir das fontes abertas e grava em prototipos/globo/dados/ (só quando alguém dispara).
# Roda aqui, e não no ambiente de desenvolvimento, porque algumas fontes limitam IPs compartilhados. Depois, rode "Publicar".
name: Dados

on:
  workflow_dispatch:
    inputs:
      detalhe:
        description: "Refazer também o detalhamento ano a ano (58 consultas ao Comex Stat, cerca de 30 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest (26.04) não tem mais Python 3.9 (D58)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Retrato (Comex Stat, ONU, OMC, UCDP, Banco Mundial)
        run: python -m rotzx mundo-atualizar

      - name: Detalhamento ano a ano
        if: inputs.detalhe
        run: python -m rotzx detalhe-gerar

      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototipos/globo/dados/
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Dados do atlas de $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

<style>
  /* rotzx — atlas das relações comerciais do Brasil. Identidade editorial (D49): tema claro principal, linhas finas,
     serifa nos títulos e nas descobertas, sans nos textos e controles, números tabulares. Cores só por tokens. */
  :root {
    --bg: #F3F0E8; --surface: #FAF8F3; --ink: #222721; --ink-2: #464C45; --muted: #676B62;
    --rule: #D8D4C9; --rule-2: #BDB8AB; --accent: #385344; --accent-ink: #2C4436; --ochre: #A16D2F; --neg: #9A4A3A;
    --sel-bg: #E3E9E1; --hover: #ECE9E0; --warn: #8A5A12; --on-accent: #FAF8F3;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151916; --surface: #1C211D; --ink: #E9E6DE; --ink-2: #C3C2B8; --muted: #9C9D93;
      --rule: #343A34; --rule-2: #4A514A; --accent: #8DBA9F; --accent-ink: #A9D0B8; --ochre: #D7A465; --neg: #E19A88;
      --sel-bg: #26302A; --hover: #222823; --warn: #E0B45C; --on-accent: #151916; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151916; --surface: #1C211D; --ink: #E9E6DE; --ink-2: #C3C2B8; --muted: #9C9D93;
    --rule: #343A34; --rule-2: #4A514A; --accent: #8DBA9F; --accent-ink: #A9D0B8; --ochre: #D7A465; --neg: #E19A88;
    --sel-bg: #26302A; --hover: #222823; --warn: #E0B45C; --on-accent: #151916; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .kicker { font: 600 11.5px/1.3 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); }
  .num, td, .val, .v, output { font-variant-numeric: tabular-nums lining-nums; }
  button { transition: background-color .15s, color .15s, border-color .15s; }

  /* bandeiras: tamanho fixo, borda fina; sem bandeira, um retângulo neutro */
  .flag { display: inline-block; width: 20px; height: 15px; flex: none; border-radius: 1.5px; object-fit: cover; vertical-align: -2px;
          background: var(--hover); box-shadow: 0 0 0 1px rgba(34,39,33,.16); }
  .flag.g { width: 40px; height: 30px; border-radius: 2px; vertical-align: -5px; }
  .flag.vazia { background: repeating-linear-gradient(135deg, var(--rule) 0 2px, transparent 2px 5px); }

  /* cabeçalho: marca, descrição, navegação essencial, busca, fontes, tema */
  .barra { display: flex; align-items: center; gap: 8px 22px; padding: 12px 32px; border-bottom: 1px solid var(--ink); background: var(--bg); }
  .marca { display: inline-flex; align-items: center; color: var(--accent); text-decoration: none; }
  .marca .logo { display: block; height: 28px; width: auto; }
  .marca-desc { margin: 0; padding-left: 16px; border-left: 1px solid var(--rule-2); font: 400 15px/1.25 var(--serif); font-style: italic; color: var(--ink-2); white-space: nowrap; }
  .nav { display: flex; gap: 2px; margin-left: auto; }
  .nav button, .fontes-link { border: 0; background: none; padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-radius: 3px; white-space: nowrap; }
  .nav button:hover, .fontes-link:hover { color: var(--ink); background: var(--hover); }
  .nav button[aria-current="page"], .fontes-link[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
  .tema { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--rule-2); border-radius: 50%; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 15px; flex: none; }
  .tema:hover { color: var(--ink); border-color: var(--ink-2); }

  /* busca com sugestões (bandeira + nome) */
  .ac { position: relative; }
  .ac input { width: 240px; padding: 8px 12px; border-radius: 3px; border: 1px solid var(--rule-2); background: var(--surface); font-size: 14.5px; outline: none; }
  .ac input::placeholder { color: var(--muted); }
  .ac input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .ac ul { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; min-width: 260px; max-height: 340px; overflow-y: auto; margin: 0; padding: 4px;
           list-style: none; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 3px; box-shadow: 0 8px 24px rgba(34,39,33,.12); }
  .ac li { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 2px; cursor: pointer; font-size: 14.5px; }
  .ac li[aria-selected="true"], .ac li:hover { background: var(--sel-bg); }
  .ac li small { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* quadro: mapa à esquerda, leitura à direita; sem moldura, só uma linha */
  .quadro { display: grid; grid-template-columns: minmax(340px, 35fr) minmax(0, 65fr); height: max(640px, calc(100vh - 62px)); transition: grid-template-columns .2s ease; }
  .lado-mapa { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: var(--surface); }
  .mapa-topo { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
  .modos { display: flex; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; }
  .modos button { border: 0; background: transparent; padding: 6px 14px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .modos button + button { border-left: 1px solid var(--rule-2); }
  .modos button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .modos button:disabled { color: var(--muted); cursor: not-allowed; text-decoration: line-through; text-decoration-color: var(--rule-2); }
  .area { position: relative; flex: 1; min-height: 0; background: var(--surface); }
  #globo { position: absolute; inset: 0; }
  .zoom { position: absolute; right: 16px; top: 16px; z-index: 3; display: grid; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; background: var(--surface); }
  .zoom button { width: 38px; height: 36px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--ink-2); }
  .zoom button:hover { background: var(--hover); color: var(--ink); }
  .zoom button + button { border-top: 1px solid var(--rule-2); }
  .lista { position: absolute; inset: 0; z-index: 2; display: none; overflow-y: auto; padding: 16px 22px; background: var(--surface); }
  body.modo-lista .lista { display: block; }
  body.modo-lista .zoom { display: none; }
  .lista .rank button { grid-template-columns: 26px 20px minmax(0, 1fr) minmax(92px, auto); grid-template-rows: auto auto; row-gap: 5px; }
  .lista .rank .tr { grid-column: 3 / 4; grid-row: 2; }
  .lista .rank .val { grid-column: 4; grid-row: 1 / 3; }
  .aviso-3d { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); }
  .aviso-3d::before { content: "Lista"; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin-right: 8px; }
  .tip { background: var(--surface); border: 1px solid var(--rule-2); padding: 8px 11px; border-radius: 3px; font: 13.5px/1.4 var(--sans); color: var(--ink); box-shadow: 0 4px 14px rgba(34,39,33,.12); }
  .tip b { font-weight: 600; } .tip span { display: block; color: var(--ink-2); font-size: 12.5px; }
  .tip .delta { color: var(--ink); } .tip em { display: block; margin-top: 4px; font-style: normal; font-size: 12px; color: var(--accent-ink); }

  /* controle único (D54): métrica, linha do tempo e legenda num só lugar — no painel do mapa ou, com o mapa recolhido, na barra da análise */
  .quadro > *, .lado-mapa, .controles, .ctl { min-width: 0; }
  .controles { padding: 12px 20px 14px; border-top: 1px solid var(--rule); background: var(--surface); }
  .controles[hidden], .barra-analise[hidden] { display: none; }
  /* D64: Produtos e Comparar só usam o ano; Fontes não usa nenhum controle do mapa */
  body.ctl-ano .ctl .metricas { display: none; }
  body.ctl-ano .slot-ctl .ctl { grid-template-columns: minmax(240px, 420px); justify-content: start; }
  body.ctl-nenhum .controles, body.ctl-nenhum .slot-ctl { display: none; }
  .ctl { display: grid; gap: 10px; }
  .tempo { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .tempo button { width: 36px; height: 34px; border: 1px solid var(--rule-2); border-radius: 50%; background: transparent; cursor: pointer; font-size: 11px; color: var(--ink-2); }
  .tempo button:hover { border-color: var(--ink-2); color: var(--ink); }
  .tempo input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); display: block; }
  .tempo .marcas { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tempo output { font: 500 28px/1 var(--serif); min-width: 2.6em; text-align: right; transition: color .2s; }
  .tempo.recorte-t input[type=range] { accent-color: var(--ochre); }
  .tempo-nota { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
  .slot-ctl:empty { display: none; }
  .slot-ctl { flex: 1 1 100%; order: 3; }
  .slot-ctl .ctl { grid-template-columns: minmax(0, 1fr) minmax(240px, 380px); align-items: center; gap: 6px 22px; }
  .slot-ctl .tempo output { font-size: 22px; }
  .slot-ctl .tempo-nota { grid-column: 1 / -1; margin: 0; }
  .metricas { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; }
  .metricas button { border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 3px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .metricas button:hover { background: var(--hover); color: var(--ink); }
  .metricas button[aria-pressed="true"] { background: var(--sel-bg); color: var(--ink); border-color: var(--rule-2); font-weight: 600; }
  .metricas .sep { color: var(--muted); font-size: 12px; margin: 0 2px 0 6px; padding-left: 8px; border-left: 1px solid var(--rule); }
  .anos-chips, .chips { display: flex; gap: 0; flex-wrap: wrap; }
  .anos-chips button, .chips button { padding: 5px 12px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2); margin: 0 -1px -1px 0; }
  .anos-chips button:first-child, .chips button:first-child { border-radius: 3px 0 0 3px; }
  .anos-chips button:last-child, .chips button:last-child { border-radius: 0 3px 3px 0; }
  .anos-chips button:hover, .chips button:hover { background: var(--hover); color: var(--ink); }
  .anos-chips button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); position: relative; }
  .chips { margin-top: 10px; }
  .chips.soltos { gap: 6px; } .chips.soltos button { border-radius: 3px; margin: 0; }
  .atalhos { margin-top: 14px; } .atalhos button { padding: 6px 12px; min-height: 36px; white-space: nowrap; }
  .aviso-ano { margin: 0; padding: 10px 40px; border-bottom: 1px solid var(--rule); background: var(--surface); font-size: 14px; color: var(--ink-2); }
  .leg { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 5px; }
  .leg .grad { height: 8px; border-radius: 1px; max-width: 420px; }
  .leg .ext { display: flex; justify-content: space-between; color: var(--muted); max-width: 420px; }
  .leg .cats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .leg i { display: inline-block; width: 11px; height: 11px; border-radius: 1px; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px var(--rule-2); }
  .leg .aviso { color: var(--warn); }
  .leg .ref-br { color: var(--muted); }

  /* coluna de leitura */
  .lado-texto { position: relative; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; min-height: 0; }   /* relative: elementos .sr ficam presos à coluna, não esticam a página (D64) */
  /* desktop (D64): só a coluna da análise rola; a página fica do tamanho da janela e o cabeçalho nunca sai do topo */
  @media (min-width: 981px) and (min-height: 600px) {
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    body > .barra { flex: none; }
    body > .quadro { flex: 1 1 auto; height: auto; min-height: 0; }
  }
  .sec { padding: 26px 40px; border-bottom: 1px solid var(--rule); }
  .sec:last-child { border-bottom: 0; }
  .sec h1, .sec h2 { font: 500 38px/1.08 var(--serif); margin: 10px 0 10px; letter-spacing: -.018em; text-wrap: balance; }
  .sec h1 { font-size: 46px; letter-spacing: -.024em; max-width: 16ch; }
  .sec h3 { font: 500 22px/1.25 var(--serif); margin: 0 0 8px; letter-spacing: -.008em; text-wrap: balance; }
  .lead { color: var(--ink-2); font-size: 17px; line-height: 1.5; margin: 0; max-width: 60ch; }
  .meta { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 0; }
  .meta > span:not(:last-child)::after { content: "·"; margin: 0 8px; }   /* o separador fica no fim da linha quando ela quebra */
  .fonte { font-size: 12.5px; color: var(--muted); margin: 2px 0 14px; }
  .fonte a { color: inherit; }
  .nota { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 68ch; }
  /* faixa de indicadores: números separados por linhas finas, sem caixa por número */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); margin: 14px 0 4px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .kpi { padding: 12px 16px 13px; min-width: 0; border-left: 1px solid var(--rule); }
  .kpi:first-child { border-left: 0; padding-left: 0; }
  .kpi span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
  .kpi b { display: block; margin-top: 4px; font: 500 24px/1.15 var(--serif); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
  .kpi small { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
  .resumo-txt { margin: 0; font-size: 16.5px; line-height: 1.6; max-width: 64ch; }
  .resumo-txt + .resumo-txt { margin-top: 8px; }
  .resumo-txt b { font-weight: 600; }

  /* entrada em forma de história (D54): cada passo pinta o globo quando chega ao meio da leitura */
  .abertura { padding-top: 34px; padding-bottom: 30px; }
  .passo { position: relative; padding-top: 34px; padding-bottom: 38px; transition: background-color .3s; }
  .passo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); transform: scaleY(0); transform-origin: top; transition: transform .35s ease; }
  .passo.ativo::before { transform: scaleY(1); }
  .passo .passo-n { display: flex; gap: 10px; align-items: baseline; }
  .passo .passo-n .num { color: var(--muted); }
  .passo h3 { font-size: 32px; line-height: 1.12; letter-spacing: -.02em; max-width: 26ch; margin: 8px 0 14px; }
  .passo p { margin: 0 0 14px; color: var(--ink-2); font-size: 15.5px; line-height: 1.55; max-width: 62ch; }
  .passo .grafico { height: 230px; }
  .passo-duas { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 6px 32px; align-items: start; }
  .cena-anos { display: inline-flex; margin: 0 0 14px; }
  .cena-anos .chips { margin: 0; }
  .portas { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .portas button { width: 100%; height: 100%; text-align: left; padding: 14px 16px 16px; border: 1px solid var(--rule-2); border-radius: 3px; background: var(--surface); cursor: pointer; display: grid; gap: 4px; transition: border-color .15s, transform .15s, background-color .15s; }
  .portas button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .portas b { font: 500 19px/1.2 var(--serif); }
  .portas span { font-size: 13.5px; color: var(--ink-2); }
  .caminho .ac input { width: 100%; max-width: 520px; font-size: 16px; padding: 10px 12px; }
  .mini-barras { list-style: none; margin: 4px 0 16px; padding: 0; }
  .mini-barras li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .mini-barras .trilho { grid-column: 2 / -1; height: 4px; background: var(--hover); }
  .mini-barras .trilho i { display: block; height: 100%; background: var(--ochre); }
  .titulo-sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* rankings: linhas compactas, valores alinhados, barras discretas */
  .rank { list-style: none; margin: 6px 0 0; padding: 0; }
  .rank li { border-bottom: 1px solid var(--rule); }
  .rank li.atual { background: var(--sel-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .rank button { width: 100%; display: grid; grid-template-columns: 30px 20px minmax(0, 1fr) minmax(48px, 22%) minmax(92px, auto); gap: 10px; align-items: center; padding: 9px 4px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 14.5px; min-height: 44px; }
  .rank button:hover, .rank button.realce { background: var(--hover); }
  .rank button.realce .nome, .link.realce { text-decoration-color: var(--ink); }
  .rank button:hover .nome { text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  .rank .pos { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .rank .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .val { text-align: right; white-space: nowrap; color: var(--ink); }
  .rank .val small { display: block; color: var(--muted); font-size: 12px; }
  .rank .tr { height: 6px; background: var(--hover); position: relative; }
  .rank .tr i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); opacity: .85; }
  .rank.imp .tr i { background: var(--ochre); }
  .rank .tr.div::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--rule-2); }
  .rank .tr.div i { left: 50%; } .rank .tr.div i.neg { left: auto; right: 50%; background: var(--neg); }
  .rank .sem .val { color: var(--muted); }
  .escala-nota { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .botoes { display: flex; gap: 8px 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { padding: 8px 14px; border-radius: 3px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; color: var(--ink); min-height: 38px; }
  .btn:hover { border-color: var(--ink-2); background: var(--hover); }

  /* abertura do país */
  .pais-cab { padding: 28px 40px 22px; border-bottom: 1px solid var(--rule); position: relative; }
  .pais-cab h2 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 500 44px/1.05 var(--serif); letter-spacing: -.022em; margin: 10px 56px 8px 0; }

  .fechar { position: absolute; top: 24px; right: 32px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; color: var(--ink-2); font-size: 15px; }

  .abas { display: flex; gap: 28px; padding: 0 40px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 4; background: var(--bg); }
  .abas button { border: 0; background: transparent; padding: 14px 0 12px; cursor: pointer; color: var(--ink-2); font: 500 17px/1.2 var(--serif); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button:hover { color: var(--ink); }
  .abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .grafico { width: 100%; height: 250px; }
  .grafico.baixo { height: 150px; }
  details.dados { margin-top: 10px; font-size: 13px; }
  details.dados summary, details.sobre summary, details.det summary, details.ficha summary { cursor: pointer; width: max-content; max-width: 100%; }
  details.dados summary { color: var(--ink-2); }
  details.dados table { border-collapse: collapse; margin-top: 8px; width: 100%; }
  details.dados th, details.dados td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); }
  details.dados th { font-weight: 600; color: var(--ink-2); }
  details.dados th:first-child, details.dados td:first-child { text-align: left; }
  /* listas de produtos: nome curto, valor, participação, barra; SH4 em segundo plano */
  .barras { list-style: none; margin: 6px 0 0; padding: 0; }
  .barras li { padding: 9px 0 10px; border-bottom: 1px solid var(--rule); }

  .barras button.link, .link { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; font-size: inherit; }
  .barras button.link:hover, .link:hover { text-decoration-color: var(--ink); }
  .barras .parte { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .barras .parte b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .barras .pnome { min-width: 0; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .lista-ctx { list-style: none; margin: 6px 0 0; padding: 0; }
  .lista-ctx li { padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .lista-ctx li span { display: block; font-size: 12.5px; color: var(--muted); }
  .vazio { border-left: 2px solid var(--rule-2); padding: 4px 0 4px 12px; color: var(--ink-2); font-size: 14px; }
  details.ficha summary { font: 500 20px/1.3 var(--serif); }
  table.comp { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.comp th, table.comp td { padding: 9px 8px; border-bottom: 1px solid var(--rule); text-align: right; font-size: 14.5px; }
  table.comp th:first-child, table.comp td:first-child { text-align: left; color: var(--ink-2); font-weight: 400; padding-left: 0; }

  table.comp tr.atual td { color: var(--ink); font-weight: 600; background: var(--sel-bg); }
  .fontes dt { font: 500 18px/1.3 var(--serif); margin-top: 18px; }
  .fontes dt:first-child { margin-top: 0; }
  .fontes dd { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; max-width: 72ch; }
  select { background: var(--surface); border: 1px solid var(--rule-2); border-radius: 3px; padding: 4px 8px; color: var(--ink); }

  /* comparação: composição própria, cores de série estáveis (A verde, B ocre) */
  .ser-a { --ser: var(--accent); } .ser-b { --ser: var(--ochre); }
  .ponto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ser); flex: none; vertical-align: 1px; }
  .cmp-cab { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 18px; border-top: 1px solid var(--rule); }
  .cmp-lado { padding: 16px 24px 4px 0; border-top: 3px solid var(--ser); margin-top: -1px; min-width: 0; }
  .cmp-lado + .cmp-lado { padding-left: 24px; border-left: 1px solid var(--rule); }
  .cmp-lado .nomeg { display: flex; align-items: center; gap: 12px; font: 500 28px/1.1 var(--serif); letter-spacing: -.015em; margin: 6px 0 12px; min-height: 31px; }
  .cmp-lado .nomeg.vazio-n { color: var(--muted); font-size: 20px; }

  .cmp-lado .nota { margin: 0 0 4px; }

  .aviso-cmp { color: var(--warn); font-size: 14px; margin: 8px 0 0; }
  table.comp th .ponto, .cab-col .ponto { margin-right: 6px; }
  .pais-m { display: none; }
  .cab-col { display: flex; align-items: center; gap: 8px; font: 500 17px/1.3 var(--serif); padding-bottom: 6px; border-bottom: 2px solid var(--ser); margin-bottom: 2px; }

  /* espaço de leitura (D48): na análise o conteúdo ganha mais largura; "Ampliar análise" recolhe o mapa */
  body.analise .quadro { grid-template-columns: minmax(320px, 33fr) minmax(0, 67fr); }
  body.amplo .quadro { grid-template-columns: minmax(0, 1fr); }
  body.amplo .lado-mapa { display: none; }
  body.amplo .lado-texto { max-width: 1160px; width: 100%; justify-self: center; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
  body.amplo .grafico { height: 320px; }
  body.amplo .grafico.baixo { height: 170px; }
  body.amplo .duas-amplo { display: grid; grid-template-columns: 1fr 1fr; }
  body.amplo .duas-amplo > .sec + .sec { border-left: 1px solid var(--rule); }
  .barra-analise { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 40px; border-bottom: 1px solid var(--rule); background: var(--surface); }
  .trilha { font-size: 13.5px; color: var(--ink-2); min-width: 0; flex: 1 1 260px; }
  .trilha button.link { color: var(--ink-2); }
  .trilha [aria-current] { color: var(--ink); font-weight: 500; }
  .barra-analise .acoes { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; flex-shrink: 0; margin-left: auto; white-space: nowrap; }
  #alternarMapa { min-width: 9.6em; justify-content: center; text-align: center; }   /* "Ampliar análise" e "Mostrar mapa" ocupam o mesmo espaço (D64) */
  .ano-sel { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
  details.sobre { margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  details.sobre summary, details.det summary { color: var(--muted); }
  details.sobre summary:hover, details.det summary:hover { color: var(--ink); }
  details.sobre > div { margin-top: 6px; padding: 2px 0 2px 12px; border-left: 2px solid var(--rule-2); line-height: 1.55; max-width: 70ch; }
  details.det { margin-top: 3px; font-size: 12px; }
  details.det > div { margin-top: 4px; color: var(--muted); line-height: 1.45; }
  .foco-prod { background: var(--surface); }
  .ref-prod { margin: 0 0 6px; font: 400 19px/1.35 var(--serif); font-style: italic; color: var(--ink-2); }
  .pos-prod { margin: 0 0 4px; font-size: 16.5px; } .pos-prod b { font-weight: 600; } .pos-prod span { color: var(--muted); font-size: 14px; }
  .carregando { color: var(--muted); font-size: 14px; }

  /* identidade brasileira nos detalhes (D51): silhueta do Brasil no carregamento e na assinatura */
  .carregando-br { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; padding: 6px 0; opacity: 0; animation: aparece .2s ease-out .35s forwards; }
  .br-silhueta { width: 34px; height: 35px; flex: none; overflow: visible; }
  .br-silhueta path { fill: var(--accent); fill-opacity: 0; stroke: var(--accent); stroke-width: 3.2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

  @keyframes tracar { 0% { stroke-dashoffset: 1; fill-opacity: 0; } 70% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: .16; } }
  @keyframes aparece { to { opacity: 1; } }
  .carga-globo { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; }
  .falha { border-left: 2px solid var(--ochre); padding: 4px 0 4px 12px; font-size: 14.5px; color: var(--ink-2); }
  .falha p { margin: 0 0 10px; }

  .assinatura { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 30px 40px 40px; border-top: 1px solid var(--ink); }
  .assinatura .br-silhueta { width: 42px; height: 43px; grid-row: 1 / 3; }
  .assinatura .br-silhueta path { stroke-dashoffset: 0; fill-opacity: .12; stroke-width: 2.6; }
  .patria { margin: 0; font: 400 24px/1.2 var(--serif); font-style: italic; letter-spacing: -.01em; }
  .patria::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 10px; border-radius: 50%; background: var(--ochre); vertical-align: middle; }
  .assinatura .meta { margin: 0; }
  /* cobertura do recorte por produto: o que é detalhado, o que está em "Outros" */
  .recorte { margin: 10px 0 2px; padding-left: 10px; border-left: 2px solid var(--accent); font-size: 14px; color: var(--ink-2); max-width: 70ch; }

  .sub-camada { font: 600 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); margin: 6px 0 4px; }

  details.ncm > summary { cursor: pointer; list-style-position: outside; }
  .ncm-det .barras li { padding: 6px 0 7px; } .ncm-det .barras .lin { font-size: 13px; }
  /* exportação e compartilhamento (D62) */
  .acoes-dado { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
  .acoes-dado .btn, .btn-leve { min-height: 32px; padding: 5px 11px; font-size: 13px; color: var(--ink-2); }

  #dlgIncorporar { max-width: min(560px, calc(100vw - 32px)); border: 1px solid var(--rule-2); border-radius: 4px; background: var(--surface); color: var(--ink); padding: 22px 24px; }

  #dlgIncorporar h2 { font: 500 24px/1.2 var(--serif); margin: 0 0 6px; }
  #codIframe { width: 100%; margin-top: 10px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--rule-2); border-radius: 3px; padding: 10px; resize: vertical; }
  body.embed .barra, body.embed .lado-mapa, body.embed #alternarMapa, body.embed #incorporar, body.embed .pular { display: none !important; }
  body.embed .quadro { height: 100vh; }
  body.embed .lado-texto { max-width: none; border: 0; }
  .selo-embed { position: fixed; right: 12px; bottom: 12px; z-index: 40; padding: 7px 12px; border-radius: 3px; background: var(--ink); color: var(--bg); font-size: 13px; text-decoration: none; }
  .selo-embed[hidden] { display: none; }
  .aviso-geral { margin: 0; padding: 10px 40px; border-bottom: 1px solid var(--rule); background: var(--surface); font-size: 14px; color: var(--ink-2); }
  .aviso-geral::before, .aviso-ano::before { content: "Aviso"; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ochre); margin-right: 8px; }

  .pular:focus { top: 10px; }
  details.dados { overflow-x: auto; }

  @media (max-width: 1180px) {
    .marca-desc { display: none; }
    .ac input { width: 200px; }
  }
  @media (max-width: 980px) {
    .barra { flex-wrap: wrap; gap: 8px 10px; padding: 10px 16px 0; border-bottom-width: 1px; }
    .marca { margin-right: auto; } .marca .logo { height: 26px; }
    .barra .ac { order: 4; width: 100%; }
    .ac input { width: 100%; font-size: 16px; padding: 10px 12px; }
    .nav { order: 5; width: calc(100% + 32px); margin: 0 -16px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--rule); }
    .nav button { padding: 11px 9px; font-size: 14.5px; }
    .fontes-link { font-size: 13.5px; padding: 8px 6px; }
    body.analise .quadro { grid-template-columns: minmax(0, 1fr); }
    .quadro { grid-template-columns: minmax(0, 1fr); height: auto; }
    .barra-analise { padding: 8px 16px; position: sticky; top: 0; z-index: 6; }
    body.amplo .lado-texto { border: 0; }
    body.amplo .duas-amplo { grid-template-columns: 1fr; }
    body.amplo .duas-amplo > .sec + .sec { border-left: 0; }
    body.amplo .grafico { height: 250px; }
    .lado-mapa { border-right: 0; border-bottom: 1px solid var(--rule); }
    .area { height: 32vh; min-height: 230px; flex: none; }
    /* entrada no celular: o globo fica preso no alto enquanto a história rola; os controles completos ficam na análise */
    body:not(.analise) .quadro { display: block; }
    body:not(.analise) .lado-mapa { position: sticky; top: 0; z-index: 7; box-shadow: 0 6px 14px rgba(0,0,0,.08); }
    body:not(.analise) .mapa-topo { display: none; }
    body:not(.analise) .area { height: 28vh; min-height: 190px; }
    body:not(.analise) .controles { padding: 6px 16px 8px; }
    body:not(.analise) .ctl .metricas, body:not(.analise) .ctl .tempo, body:not(.analise) .ctl .tempo-nota,
    body:not(.analise) .ctl .leg > :not(:first-child) { display: none; }
    body:not(.analise) .zoom { display: none; }
    .slot-ctl .ctl { grid-template-columns: minmax(0, 1fr); }
    .aviso-geral, .aviso-ano { padding: 10px 16px; }
    .assinatura { padding: 26px 16px 34px; }
    .lado-texto { overflow: visible; }
    .sec { padding: 22px 16px; }
    .sec h1 { font-size: 36px; } .sec h2 { font-size: 31px; }
    .pais-cab { padding: 22px 16px 18px; } .pais-cab h2 { font-size: 34px; margin-right: 48px; }
    .fechar { top: 18px; right: 16px; }
    .abas { padding: 0 16px; gap: 20px; overflow-x: auto; scrollbar-width: none; }
    .abas button { white-space: nowrap; font-size: 16px; padding: 13px 0 11px; }
    .duas { grid-template-columns: 1fr; gap: 22px; }
    .controles { padding: 10px 16px 12px; }
    .metricas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .metricas button { padding: 9px 11px; white-space: nowrap; }
    .mapa-topo { padding: 10px 16px; }
    .passo-duas { grid-template-columns: 1fr; }
    .passo h3 { font-size: 26px; }
    .kpis { grid-template-columns: 1fr 1fr; border-bottom: 0; }
    .kpi { border-left: 0; padding-left: 0; border-bottom: 1px solid var(--rule); }
    .kpi:nth-child(even) { border-left: 1px solid var(--rule); padding-left: 14px; }
    .rank button { grid-template-columns: 26px 20px minmax(0, 1fr) minmax(86px, auto); grid-template-rows: auto auto; row-gap: 5px; }
    .rank .tr { grid-column: 3 / 4; grid-row: 2; }
    .rank .val { grid-column: 4; grid-row: 1 / 3; }
    .cmp-cab { grid-template-columns: 1fr; }
    .cmp-lado, .cmp-lado + .cmp-lado { padding: 14px 0 6px; border-left: 0; }
    .cmp-lado .nomeg { font-size: 25px; }
    /* comparação no celular: cada medida vira um bloco; o valor fica colado ao nome do país */
    table.comp.cmp thead { display: none; }
    table.comp.cmp, table.comp.cmp tbody, table.comp.cmp tr { display: block; }
    table.comp.cmp tr { padding: 10px 0; border-bottom: 1px solid var(--rule); }
    table.comp.cmp th, table.comp.cmp td { display: flex; justify-content: space-between; gap: 10px; border: 0; padding: 3px 0; text-align: right; }
    table.comp.cmp th { color: var(--ink); font-weight: 600; padding-bottom: 5px; }
    table.comp.cmp .pais-m { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); text-align: left; }
  }
  /* troca de tela (D60): o conteúdo antigo sai na hora e o novo aparece com um esmaecer curto, só na coluna de leitura.
     Sem View Transitions: a foto da coluna (que rola) era desenhada por cima do cabeçalho e da barra durante a troca. */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    .carregando-br { opacity: 1; } .carregando-br .br-silhueta path { stroke-dashoffset: 0; fill-opacity: .12; } }

// ---------- formatos ----------
const nf = (v, c) => v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
function usd(v) {                     // escala adaptada à grandeza; null = sem dado (nunca "US$ 0,0 bi")
  if (v == null) return "sem dado";
  if (v === 0) return "US$ 0";
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e12) return `${s}US$ ${nf(a / 1e12, 2)} tri`;
  if (a >= 1e9) return `${s}US$ ${nf(a / 1e9, a >= 1e11 ? 0 : 1)} bi`;
  if (a >= 1e6) return `${s}US$ ${nf(a / 1e6, a >= 1e8 ? 0 : 1)} mi`;
  if (a >= 1e3) return `${s}US$ ${nf(a / 1e3, 0)} mil`;
  return `${s}US$ ${nf(a, 0)}`;
}
function pct(x, c = 1) {              // x em fração (0,25 = 25%); muito pequeno não vira "0,0%"
  if (x == null) return "sem dado";
  if (x === 0) return "0%";
  if (Math.abs(x) < 0.0005) return x > 0 ? "menos de 0,1%" : "−menos de 0,1%";
  return nf(x * 100, c) + "%";
}
const usdR = (v) => (v == null ? "sem registro" : usd(v));
const parteR = (t, k) => (t?.[k] == null ? "sem registro" : pct(t[k === "e" ? "pe" : "pi"]));      // participação só quando o fluxo existe

    novo("#gCmp", { tooltip: dica(pct), legend: leg([nome(a), nome(b)]), xAxis: eixoX(ini, fim), yAxis: eixoY(pctEixo),
      series: [linha(nome(a), part(a), PAL.exp, { curto: curto(a), marcaL: marca() }), linha(nome(b), part(b), PAL.imp, { curto: curto(b) })] });
  }
  if (!id && st.vista === "inicio") {                         // entrada: as duas explorações com dado visível
    const ch = Array.from({ length: fim - ini + 1 }, (_, j) => trocas("156", ini + j)?.pt ?? null);
    const em_ = (a) => ({ ano: a, v: ch[a - ini] });
    novo("#gInicioChina", { grid: { left: 38, right: 18, top: 28, bottom: 24 }, tooltip: dica(pct), xAxis: eixoX(ini, fim), yAxis: eixoY(pctEixo),
      series: [{ ...linha("China: % da corrente do Brasil", ch, PAL.exp, { curto: "", larg: 2.2,
        pontos: anotar([{ ...em_(2000), txt: `${pct(em_(2000).v)} em 2000` }, { ...em_(fim), txt: `${pct(em_(fim).v)} em ${fim}`, pos: "bottom", align: "right" }]) }),
        endLabel: { show: false }, areaStyle: { color: mistura(PAL.exp, PAL.bg, 0.9) } }] });
    const cE = C.paises["156"]?.e, uE = C.paises["840"]?.e;
    if (cE && uE) novo("#gInicioCmp", { grid: { left: 44, right: 16, top: 16, bottom: 22 }, tooltip: dica(usd), legend: leg(["China", "Estados Unidos"]), xAxis: eixoX(ini, fim), yAxis: eixoY(usdEixo),
      series: [linha("China", cE, PAL.exp, { curto: "China", larg: 1.8 }), linha("Estados Unidos", uE, PAL.imp, { curto: "EUA", larg: 1.8 })] });
  }
}
addEventListener("resize", () => graficos.forEach((g) => g.resize()));

// ---------- globo ----------
// Aparência cartográfica (D49): oceano liso e claro, terra neutra para "sem registro", contornos finos,
// país selecionado em tinta escura e mais alto, Brasil em cinza com contorno (é o ponto de vista, não um parceiro).
let globo = null, poligonos = [], sobre = null;
function corPol(f) {
  if (f.id === st.pais) return PAL.ink;
  const c = f.id === BR ? PAL.br : corDe(f.id);
  return f === sobre ? mistura(c, PAL.ink, 0.25) : c;
}
const contorno = (f) => (f.id === st.pais ? PAL.ink : f.id === BR ? PAL.ink2 : PAL.escuro ? "rgba(233,230,222,.24)" : "rgba(34,39,33,.28)");
const ladoPol = (f) => (f.id === st.pais ? PAL.ink : "rgba(0,0,0,0)");
const altPol = (f) => (f.id === st.pais ? 0.03 : (!st.pais && st.vista === "comparar" && (f.id === st.a || f.id === st.b)) ? 0.018 : 0.006);
function pintarGlobo() { if (globo) globo.polygonCapColor(corPol).polygonStrokeColor(contorno).polygonSideColor(ladoPol).polygonAltitude(altPol); }
function centro(f) {
  const g = f.geometry; if (!g) return null;
  const aneis = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const maior = aneis.sort((a, b) => b.length - a.length)[0];
  const lngs = maior.map((c) => c[0]), lats = maior.map((c) => c[1]);
  const span = Math.max(Math.max(...lngs) - Math.min(...lngs), Math.max(...lats) - Math.min(...lats));
  return { lat: lats.reduce((s, x) => s + x, 0) / lats.length, lng: lngs.reduce((s, x) => s + x, 0) / lngs.length, altitude: Math.min(2.4, Math.max(0.55, span / 26)) };
}
function centroDe(id) { const f = poligonos.find((p) => p.id === id); return f ? centro(f) : null; }
// o globo para de girar e vai até o país aberto; na comparação, enquadra os dois (D54)
function enquadrar() {
  if (!globo) return;
  let alvo = null;
  if (st.pais) alvo = centroDe(st.pais);
  else if (st.vista === "comparar" && st.a && st.b) {
    const a = centroDe(st.a), b = centroDe(st.b);
    if (a && b) { let dl = b.lng - a.lng; if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
      alvo = { lat: (a.lat + b.lat) / 2, lng: a.lng + dl / 2, altitude: Math.min(3.2, 1.5 + Math.hypot(b.lat - a.lat, dl) / 55) }; }
  } else alvo = { lat: -12, lng: -45, altitude: 2.35 };
  globo.controls().autoRotate = !alvo || (!st.pais && st.vista !== "comparar" && !reduzir);
  if (reduzir) globo.controls().autoRotate = false;
  if (alvo) globo.pointOfView(alvo, reduzir ? 0 : 900);
}
// linha da lista ou do ranking em realce quando o país está sob o mouse no globo, e o contrário
function realcar(id) {
  $$(".realce").forEach((x) => x.classList.remove("realce"));
  if (id) $$(`[data-pais="${id}"], [data-pais-prod="${id}"]`).forEach((x) => x.classList.add("realce"));
}
document.addEventListener("pointerover", (e) => {
  if (!globo || !e.target.closest("#corpo, #lista")) return;
  const b = e.target.closest("[data-pais], [data-pais-prod]"), id = b ? b.dataset.pais || b.dataset.paisProd : null;
  const f = id ? poligonos.find((p) => p.id === id) || null : null;
  if (f !== sobre) { sobre = f; globo.polygonCapColor(corPol); }
});
// cartão do globo (D54): variação sobre o ano anterior, só quando os dois anos têm dado (em % para valores, em p.p. para participação)
function variacaoAnual(id) {
  const m = st.m; if (!["exp", "imp", "corrente", "part"].includes(m) || st.ano - 1 < cobertura(m)[0]) return "";
  const v1 = valor(id, m, st.ano), v0 = valor(id, m, st.ano - 1);
  if (v1 == null || v0 == null || (m !== "part" && !v0)) return "";
  return m === "part" ? `${pp(v1 - v0)} sobre ${st.ano - 1}` : `${v1 >= v0 ? "+" : "−"}${pct(Math.abs(v1 / v0 - 1))} sobre ${st.ano - 1}`;
}
function tingir() {                    // oceano em cor lisa, sem textura nem brilho
  if (!globo) return;
  const mat = globo.globeMaterial();
  mat.shininess = 0; if (mat.specular) mat.specular.set("#000000");
  mat.color.set("#000000");
  if (mat.emissive) { mat.emissive.set(PAL.oceano); mat.emissiveIntensity = 1; } else mat.color.set(PAL.oceano);
  mat.needsUpdate = true;
}
function iniciarGlobo(atlas) {
  poligonos = topojson.feature(atlas, atlas.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const el = $("#globo");
  globo = Globe()(el)
    .backgroundColor("rgba(0,0,0,0)").showGraticules(true).showAtmosphere(false)
    .polygonsData(poligonos).polygonCapColor(corPol).polygonSideColor(ladoPol).polygonStrokeColor(contorno)
    .polygonAltitude(altPol).polygonsTransitionDuration(reduzir ? 0 : 200)
    .polygonLabel((f) => { const id = f.id; if (!H.paises[id]) return `<div class="tip"><b>${esc(f.properties.name)}</b><span>sem dados na base</span></div>`;
      const v = id === BR ? null : valor(id), p = id === BR ? null : posicao(id);
      const abrir = id !== BR ? `<em>Clique para abrir a relação com o Brasil</em>` : "";
      if (id !== BR && st.m === "prod" && P) return `<div class="tip">${bandeira(id)} <b>${esc(nome(id))}</b><span>${esc(rotAtalho(st.prod))} · ${st.fluxo === "e" ? "exportações" : "importações"} · ${st.ano}: ${esc(textoProdEstado(id))}</span>${abrir}</div>`;
      const d = id === BR ? "" : variacaoAnual(id);
      return `<div class="tip">${bandeira(id)} <b>${esc(nome(id))}</b><span>${id === BR ? "ponto de referência da análise" : `${esc(MET[st.m].rot)} em ${st.ano}: ${esc(fmtValor(v))}${p ? ` · ${ord(p[0])} de ${p[1]}` : ""}`}</span>${d ? `<span class="delta">${d}</span>` : ""}${abrir}</div>`; })
    .onPolygonHover((f) => { sobre = f; globo.polygonCapColor(corPol); el.style.cursor = f ? "pointer" : "grab"; realcar(f && H.paises[f.id] ? f.id : null); })
    .onPolygonClick((f) => { if (H.paises[f.id]) abrirPais(f.id); });
  tingir();
  globo.controls().autoRotateSpeed = 0.18;
  const ajustar = () => globo.width(el.clientWidth).height(el.clientHeight);
  addEventListener("resize", ajustar); if (window.ResizeObserver) new ResizeObserver(ajustar).observe(el); ajustar();
  enquadrar();
  const pa = cenaAtual && $("#" + passoAtivo); if (pa) aplicarCena(pa);        // a história já tinha uma cena antes de o globo abrir
}
$("#mais").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.controls().autoRotate = false; globo.pointOfView({ ...v, altitude: Math.max(0.25, v.altitude * 0.75) }, 300); };
$("#menos").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.pointOfView({ ...v, altitude: Math.min(4, v.altitude * 1.33) }, 300); };

// ---------- partida ----------
autocompletar($("#busca"), $("#buscaLista"), buscarPais, (id) => { $("#busca").value = ""; abrirPaisGeral(id); });
Object.assign(st, lerURL());
if (location.hash && (!location.hash.includes("=") || anoAjuste)) history.replaceState(null, "", urlDe(st));   // converte #China em #pais=CHN…; ano ajustado vai para a URL
render(true);
fetch("dados/detalhe/indice.json").then((r) => (r.ok ? r.json() : null)).catch(() => null)
  .then((o) => {
    if (o?.schema !== SCHEMA_DET) return;
    DET.indice = o;
    // link direto para um ano que só o detalhamento tem (ex.: 2018): a página ajustou antes de o índice chegar; volta ao ano pedido
    if (anoAjuste && st.prod && (st.m === "prod" || st.pais) && anosDe(st.prod).includes(anoAjuste.pedido)) {
      st.ano = anoAjuste.pedido; anoAjuste = null; history.replaceState(null, "", urlDe(st));
    }
    render();
  });
$(".area").insertAdjacentHTML("beforeend", `<div class="carga-globo" id="cargaGlobo">${carregando("Carregando o mapa")}</div>`);
(async () => {
  try {
    if (typeof Globe !== "function") throw new Error("globe.gl não carregou");
    const t = document.createElement("canvas"); if (!(t.getContext("webgl2") || t.getContext("webgl"))) throw new Error("sem WebGL");
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    if (!r.ok) throw new Error("mapa não carregou");
    iniciarGlobo(await r.json());
    $("#cargaGlobo")?.remove();
  } catch (e) {
    $("#cargaGlobo")?.remove();
    console.warn("Globo indisponível:", e.message);
    semGlobo = true; $(".zoom").hidden = true; const bg = $('[data-modo="globo"]'); bg.disabled = true; bg.title = "O globo 3D não abriu neste navegador"; modo("lista");
  }
})();
</script>
